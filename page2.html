     <center><p><font face="TH kodchasal" size="6">ผัดหมี่โคราช หรือคั่วหมี่ เป็นอาหารพื้นเมืองเลื่องชื่อของนครราชสีมา ทำจากเส้นหมี่แห้งเหนียวนุ่มที่ทำจากข้าวเจ้า ผัดกับซอสปรุงรสรสจัดจ้าน (เผ็ด-หวาน) และเนื้อหมูสามชั้น มีแหล่งผลิตสำคัญ เช่น หมี่ตะคุ หมี่กระโทก และหมี่กุดจิก โดยมักกินคู่กับส้มตำ </font></p></center>
